[package]
name = "study_server"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = { version = "0.7.9", features = ["ws"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
futures = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1.19", features = ["v4", "serde"] }


[features]
default = []

[dev-dependencies]
tokio-tungstenite = "0.24"
